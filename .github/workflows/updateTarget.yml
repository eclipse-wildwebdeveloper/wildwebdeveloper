name: Target Platform Updates

concurrency: 
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - '**.target'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: eclipse-platform/eclipse.platform.releng.aggregator/.github/workflows/updateTarget.yml@f1e57c36f35096552708c817f1f9880c931bb5cf # master
    with:
      author: wildwebdeveloper-bot <wildwebdeveloper-bot@eclipse.org>
      path: 'target-platform'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
